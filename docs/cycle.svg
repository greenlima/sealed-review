<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" width="960" height="440" role="img" aria-labelledby="t d">
  <title id="t">The verification cycle</title>
  <desc id="d">NEAR AI machines send evidence bound to our nonce to the watcher, which also uses collateral from Intel, NVIDIA and the OS image publisher. The watcher's unsigned verdict is signed by a person on a YubiKey; the signed entry joins the hash-chained feed, whose evidence is released so anyone can rerun the checks. Each entry is appended to a locked NEAR testnet mirror that checks the signature. The gate on the client reads current verdicts from two RPC providers and sends requests only to reviewed machines.</desc>
  <style>
    text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .card { fill: #ffffff; stroke: #d1d9e0; }
    .box { fill: #ffffff; stroke: #0969da; stroke-width: 1.5; }
    .ext { fill: #f6f8fa; stroke: #d1d9e0; stroke-width: 1.5; }
    .title { fill: #1f2328; font-weight: 600; font-size: 16px; }
    .sub { fill: #59636e; font-size: 13.5px; }
    .label { fill: #59636e; font-style: italic; font-size: 13px; }
    .edge { fill: none; stroke: #59636e; stroke-width: 1.5; }
    .dash { stroke-dasharray: 5 4; }
    .head { fill: #59636e; }
    @media (prefers-color-scheme: dark) {
      .card { fill: #0d1117; stroke: #3d444d; }
      .box { fill: #0d1117; stroke: #4493f8; }
      .ext { fill: #151b23; stroke: #3d444d; }
      .title { fill: #f0f6fc; }
      .sub, .label { fill: #9198a1; }
      .edge { stroke: #9198a1; }
      .head { fill: #9198a1; }
    }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="head" d="M0,0 L10,5 L0,10 z"/>
    </marker>
  </defs>
  <rect class="card" x="0.5" y="0.5" width="959" height="439" rx="12"/>

  <rect class="ext" x="276" y="20" width="176" height="64" rx="10"/>
  <text class="title" x="364" y="46" text-anchor="middle">Intel, NVIDIA</text>
  <text class="sub" x="364" y="66" text-anchor="middle">OS image publisher</text>

  <rect class="ext" x="772" y="20" width="176" height="64" rx="10"/>
  <text class="title" x="860" y="46" text-anchor="middle">Anyone</text>
  <text class="sub" x="860" y="66" text-anchor="middle">reruns the checks</text>

  <rect class="ext" x="20" y="150" width="176" height="76" rx="10"/>
  <text class="title" x="108" y="178" text-anchor="middle">NEAR AI machines</text>
  <text class="sub" x="108" y="198" text-anchor="middle">Intel TDX CPU,</text>
  <text class="sub" x="108" y="214" text-anchor="middle">NVIDIA GPUs</text>

  <rect class="box" x="276" y="150" width="176" height="76" rx="10"/>
  <text class="title" x="364" y="178" text-anchor="middle">watcher</text>
  <text class="sub" x="364" y="198" text-anchor="middle">checks every link</text>
  <text class="sub" x="364" y="214" text-anchor="middle">of the evidence</text>

  <rect class="box" x="532" y="150" width="176" height="76" rx="10"/>
  <text class="title" x="620" y="178" text-anchor="middle">YubiKey</text>
  <text class="sub" x="620" y="198" text-anchor="middle">a person signs:</text>
  <text class="sub" x="620" y="214" text-anchor="middle">PIN and touch</text>

  <rect class="box" x="772" y="150" width="176" height="76" rx="10"/>
  <text class="title" x="860" y="178" text-anchor="middle">feed</text>
  <text class="sub" x="860" y="198" text-anchor="middle">signed entries,</text>
  <text class="sub" x="860" y="214" text-anchor="middle">hash-chained</text>

  <rect class="box" x="532" y="330" width="176" height="76" rx="10"/>
  <text class="title" x="620" y="358" text-anchor="middle">NEAR testnet mirror</text>
  <text class="sub" x="620" y="378" text-anchor="middle">checks each signature;</text>
  <text class="sub" x="620" y="394" text-anchor="middle">its code is locked</text>

  <rect class="box" x="20" y="330" width="176" height="76" rx="10"/>
  <text class="title" x="108" y="358" text-anchor="middle">gate</text>
  <text class="sub" x="108" y="378" text-anchor="middle">on the client;</text>
  <text class="sub" x="108" y="394" text-anchor="middle">pins reviewed keys</text>

  <path class="edge" d="M364 84 V148" marker-end="url(#a)"/>
  <text class="label" x="378" y="112">collateral, GPU tokens,</text>
  <text class="label" x="378" y="126">published image</text>

  <path class="edge" d="M196 194 H274" marker-end="url(#a)"/>
  <text class="label" x="236" y="168" text-anchor="middle">evidence,</text>
  <text class="label" x="236" y="182" text-anchor="middle">our nonce</text>

  <path class="edge" d="M452 194 H530" marker-end="url(#a)"/>
  <text class="label" x="492" y="168" text-anchor="middle">unsigned</text>
  <text class="label" x="492" y="182" text-anchor="middle">verdict</text>

  <path class="edge" d="M708 194 H770" marker-end="url(#a)"/>
  <text class="label" x="740" y="168" text-anchor="middle">signed</text>
  <text class="label" x="740" y="182" text-anchor="middle">entry</text>

  <path class="edge dash" d="M860 150 V86" marker-end="url(#a)"/>
  <text class="label" x="848" y="112" text-anchor="end">evidence</text>
  <text class="label" x="848" y="126" text-anchor="end">release</text>

  <path class="edge" d="M860 226 V358 Q860 368 850 368 H710" marker-end="url(#a)"/>
  <text class="label" x="872" y="300">append</text>

  <path class="edge" d="M532 368 H198" marker-end="url(#a)"/>
  <text class="label" x="365" y="346" text-anchor="middle">current verdicts, read</text>
  <text class="label" x="365" y="360" text-anchor="middle">from two RPC providers</text>

  <path class="edge" d="M108 330 V228" marker-end="url(#a)"/>
  <text class="label" x="120" y="274">requests only to</text>
  <text class="label" x="120" y="288">reviewed machines</text>
</svg>
