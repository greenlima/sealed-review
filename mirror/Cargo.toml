[package]
name = "mirror"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
description = "NEAR contract that mirrors the signed feed: it accepts an entry only if the feed key signed it and it follows the head"
repository = "https://github.com/greenlima/sealed-review.git"

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

# NEP-330 reproducible build: `cargo near build reproducible-wasm` runs in this image, identified by its digest.
[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.22.0-rust-1.99.1"
image_digest = "sha256:c9655eaf7436b90c87ea8b25739f91063032c5c30ba24cfeafe72c142943b5bb"
passed_env = []
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked"]

[dependencies]
base64 = { version = "0.23", default-features = false, features = ["alloc"] }
hex = { version = "0.4", default-features = false, features = ["alloc"] }
near-sdk = "5.30"

[dev-dependencies]
near-sdk = { version = "5.30", features = ["unit-testing"] }
ring = "0.17"

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
