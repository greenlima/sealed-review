[package]
name = "compare"
version = "0.1.0"
edition = "2024"
rust-version = "1.92"
publish = false
description = "Runs NEAR's own Rust SDK on a watcher bundle, to compare its verdict with the watcher's"

[workspace]

[dependencies]
anyhow = "1"
async-trait = "0.1"
dcap-qvl = "0.7"
nearai-inference-sdk = "=0.2.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
